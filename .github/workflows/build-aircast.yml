# Builds aircast for the Home Assistant Green (aarch64) and attaches it to a release.
# Fork-only: not part of any upstream PR.
name: build-aircast

on:
  push:
    tags: ["local-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq build-essential
          cd aircast
          make CC=gcc HOST=linux PLATFORM=aarch64 -j4
          ls -la ../bin
          file ../bin/aircast-linux-aarch64-static
      - name: Smoke test
        run: ./bin/aircast-linux-aarch64-static -h | head -5 || true
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum bin/aircast-linux-aarch64-static > bin/aircast-linux-aarch64-static.sha256
          gh release create "$GITHUB_REF_NAME" bin/aircast-linux-aarch64-static bin/aircast-linux-aarch64-static.sha256 \
            --title "$GITHUB_REF_NAME" --notes "aircast 1.12.4 + Cast queue timeout + ping_host fix. Fork build for Home Assistant." --prerelease
